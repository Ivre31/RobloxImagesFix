name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat ci

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash bin\RobloxImagesFix.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RobloxImagesFix.exe" | Out-File -FilePath bin\SHA256SUMS.txt -Encoding ascii
          Get-Content bin\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RobloxImagesFix
          path: |
            bin/RobloxImagesFix.exe
            bin/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # релиз уже создан вручную на сайте: добавляем файлы к нему
            gh release upload $tag bin\RobloxImagesFix.exe bin\SHA256SUMS.txt --clobber
          } else {
            gh release create $tag bin\RobloxImagesFix.exe bin\SHA256SUMS.txt --title $tag --generate-notes
          }
